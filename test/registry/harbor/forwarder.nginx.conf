# Loopback forwarder for Docker Desktop (see harbor.sh forwarder).
#
# Docker Desktop's daemon runs in a VM and cannot reach the host's loopback,
# where NebiusMocker's registry endpoint listens. This nginx runs with
# --network host, so it listens on the daemon's own 127.0.0.1:__PORT__ (an
# insecure-by-default registry address) and forwards every request to the
# host through host.docker.internal. It passes Host through untouched, never
# buffers bodies (layer uploads stream) and allows unlimited body sizes.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 127.0.0.1:__PORT__;
        client_max_body_size 0;
        chunked_transfer_encoding on;

        location / {
            proxy_pass http://host.docker.internal:__PORT__;
            proxy_set_header Host $http_host;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }
    }
}
