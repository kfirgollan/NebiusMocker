# Built-in Compute platform catalog (nebius.compute.v1.PlatformService).
# Source: https://docs.nebius.com/compute/virtual-machines/types
# The platform and preset names follow that page; GPU memory, quota types and
# per-region availability are ILLUSTRATIVE and may differ from the real cloud.
# Replace this whole file with NEBIUS_MOCKER_COMPUTE_PLATFORMS_FILE (YAML or JSON).
# regions: empty = every configured region; a preset's exclude_regions hides it there.
# Regions that are not configured in the mocker are never offered.
