  - name: mk8s-worker-node-v-1-32-ubuntu24.04
    human_readable: Managed Kubernetes 1.32 worker node (Ubuntu 24.04)
    description: Node image used by Managed Service for Kubernetes node groups without GPUs
    min_disk_size_gibibytes: 64
