# Built-in price list of the billing module (calculator, spot prices, pricing policies).
# Replace this whole file with NEBIUS_MOCKER_BILLING_PRICES_FILE (YAML or JSON).
#
# The prices are ILLUSTRATIVE, in the spirit of https://nebius.com/prices and
# https://nebius.com/spot-prices, and are NOT the real Nebius prices. They are
# per hour, in `currency`, as decimal strings:
#   compute.gpu_hour         per GPU-hour, covering the vCPUs and RAM of a GPU preset;
#   compute.vcpu_hour        per vCPU-hour (non-GPU platforms);
#   compute.memory_gib_hour  per GiB-hour of RAM (non-GPU platforms);
#   disks / filesystems      per GiB-hour of size.
# compute.preemptible is the platform's spot market:
#   spot       the current spot price per GPU-hour in each region (regions not
#              configured in the mocker are ignored);
#   min_price  the minimum price: a pricing policy's max_price must be at least this;
#   max_price  the highest max_price a pricing policy accepts;
#   both bounds otherwise fail with OUT_OF_RANGE.
# SKU IDs are derived from the platform / type names, so they are stable.
currency: usd
compute:
  - platform: gpu-h100-sxm
    product_title: "NVIDIA® H100 NVLink"
    gpu_hour: "2.95"
    preemptible:
      product_title: "Preemptible NVIDIA® H100 NVLink"
      min_price: "0.500"
      max_price: "50.000"
      spot: { eu-north1: "1.250" }
